name: Publish Shahe Campus map

on:
  push:
    branches:
      - master
    paths:
      - map/ShaheCampus.svg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-shahe-campus-map
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y curl fontconfig inkscape unzip
          inkscape --version

      - name: Install AWS CLI
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) aws_arch=x86_64 ;;
            aarch64|arm64) aws_arch=aarch64 ;;
            *) echo "Unsupported architecture for AWS CLI: $(uname -m)" >&2; exit 1 ;;
          esac

          aws_archive="$RUNNER_TEMP/awscliv2.zip"
          curl --fail --location --retry 3 \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            --output "$aws_archive"
          unzip -q "$aws_archive" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/aws/install" --update
          aws --version

      - name: Install Alibaba PuHuiTi fonts
        run: |
          font_dir="$HOME/.local/share/fonts/alibaba-puhuiti"

          mkdir -p "$font_dir"
          for spec in \
            "Light|https://cdn.jsdelivr.net/npm/alibabapuhuiti-3-45-light@1.0.0/AlibabaPuHuiTi-3-45-Light.ttf" \
            "Regular|https://cdn.jsdelivr.net/npm/alibabapuhuiti-3-55-regular@1.0.0/AlibabaPuHuiTi-3-55-Regular.ttf" \
            "Medium|https://cdn.jsdelivr.net/npm/alibabapuhuiti-3-65-medium@1.0.0/AlibabaPuHuiTi-3-65-Medium.ttf" \
            "Bold|https://cdn.jsdelivr.net/npm/alibabapuhuiti-3-85-bold@1.0.0/AlibabaPuHuiTi-3-85-Bold.ttf"; do
            style="${spec%%|*}"
            url="${spec#*|}"
            curl --fail --location --retry 3 "$url" \
              --output "$font_dir/AlibabaPuHuiTi-3-${style}.ttf"
          done

          fc-cache -f
          fc-match -f '%{file} | %{family} | %{style}\n' 'Alibaba PuHuiTi 3.0'

      - name: Render PNG
        run: |
          make -C map -B ShaheCampus.png
          test -s map/ShaheCampus.png

      - name: Upload PNG to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp map/ShaheCampus.png \
            "s3://byrdocs-guide-attachment/ShaheCampus.png" \
            --endpoint-url "$endpoint" \
            --region auto \
            --only-show-errors
